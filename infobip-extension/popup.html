<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 14px; background-color: #f7f8fa; color: #222; box-sizing: border-box; }
    h3 { margin: 0 0 10px; font-size: 15px; text-align: center; color: #444; }
    label { font-size: 12px; color: #555; }
    textarea { width: 100%; height: 140px; box-sizing: border-box; margin-top: 4px; font-size: 11px; font-family: monospace; padding: 6px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; padding: 9px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; background-color: #007bff; color: white; }
    button:hover { background-color: #0056b3; }
    button.secondary { background-color: #6c757d; }
    button.secondary:hover { background-color: #545b62; }
    button.green { background-color: #28a745; }
    button.green:hover { background-color: #1e7e34; }
    input[type="text"] { flex: 2; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; min-width: 0; }
    #status { margin-top: 10px; font-size: 11px; color: #555; }
    #log { margin-top: 6px; font-size: 11px; color: #444; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 6px; height: 90px; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>Infobip Automator</h3>
  <label>Links dos relatórios (um por linha):</label>
  <textarea id="links" placeholder="https://portal-ny2.infobip.com/..."></textarea>
  <div class="row">
    <button id="saveBtn">Salvar Links</button>
    <button id="runBtn">Executar Agora</button>
  </div>
  <div class="row">
    <button id="timerBtn" class="green">Ativar Timer (2h)</button>
  </div>
  <label>Testar em URL única:</label>
  <div class="row">
    <input type="text" id="testUrl" placeholder="Pode copiar um link de cima">
    <button id="testBtn" class="secondary">Testar</button>
  </div>
  <div id="status">Carregando...</div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
